<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置管理 | 天津佰莱科技有限公司</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 管理页面特有样式 */
        .admin-container {
            min-height: 100vh;
            background-color: #f5f7fa;
            padding-top: 80px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #1a6de4 0%, #0d56c2 100%);
            color: white;
            padding: 60px 0 40px;
            margin-bottom: 40px;
        }
        
        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .admin-content {
            padding: 0 20px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .admin-nav {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .admin-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        
        .admin-tab {
            padding: 12px 28px;
            background: none;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .admin-tab:hover {
            border-color: #1a6de4;
            color: #1a6de4;
        }
        
        .admin-tab.active {
            background: #1a6de4;
            border-color: #1a6de4;
            color: white;
        }
        
        .admin-panel {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eaeaea;
        }
        
        .panel-header h2 {
            font-size: 1.8rem;
            color: #333;
            margin: 0;
        }
        
        .panel-actions {
            display: flex;
            gap: 15px;
        }
        
        .btn-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
        }
        
        /* 公司信息表单 */
        .company-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h3 {
            font-size: 1.3rem;
            color: #444;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #1a6de4;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 109, 228, 0.1);
        }
        
        .form-control.textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        /* 产品管理表格 */
        .products-table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }
        
        .products-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        .products-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #444;
            border-bottom: 2px solid #eaeaea;
            white-space: nowrap;
        }
        
        .products-table td {
            padding: 15px;
            border-bottom: 1px solid #eaeaea;
            vertical-align: top;
        }
        
        .product-image-cell {
            width: 100px;
        }
        
        .product-image-preview {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #eaeaea;
        }
        
        .product-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn.edit {
            background: #e8f1ff;
            color: #1a6de4;
        }
        
        .action-btn.edit:hover {
            background: #1a6de4;
            color: white;
        }
        
        .action-btn.delete {
            background: #ffe8e8;
            color: #dc3545;
        }
        
        .action-btn.delete:hover {
            background: #dc3545;
            color: white;
        }
        
        /* 产品编辑模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            font-size: 1.5rem;
            margin: 0;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #666;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover {
            background: #f5f5f5;
            color: #333;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }
        
        /* 标签输入样式 */
        .tags-input {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            min-height: 46px;
            align-items: center;
        }
        
        .tag {
            background: #e8f1ff;
            color: #1a6de4;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .tag-remove {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .tag-remove:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .tag-input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 100px;
            padding: 5px;
            font-size: 1rem;
        }
        
        /* JSON编辑器样式 */
        .json-editor-container {
            position: relative;
        }
        
        .json-editor {
            width: 100%;
            height: 500px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 20px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            resize: vertical;
            background: #f8f9fa;
        }
        
        .json-editor:focus {
            border-color: #1a6de4;
            outline: none;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .admin-header {
                padding: 40px 0 30px;
            }
            
            .admin-header h1 {
                font-size: 2rem;
            }
            
            .admin-tabs {
                flex-direction: column;
            }
            
            .admin-tab {
                width: 100%;
                justify-content: center;
            }
            
            .company-form {
                grid-template-columns: 1fr;
            }
            
            .panel-header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            
            .panel-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .products-table th,
            .products-table td {
                padding: 10px;
                font-size: 0.9rem;
            }
            
            .product-actions {
                flex-direction: column;
            }
            
            .modal {
                max-height: 80vh;
            }
        }
        
        @media (max-width: 480px) {
            .admin-content {
                padding: 0 15px 40px;
            }
            
            .admin-nav,
            .admin-panel {
                padding: 20px;
            }
            
            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 20px;
            }
        }
        
        /* 状态消息 */
        .status-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3000;
        }
        
        .status-message.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .status-message.success {
            border-left: 4px solid #28a745;
        }
        
        .status-message.error {
            border-left: 4px solid #dc3545;
        }
        
        .status-message.warning {
            border-left: 4px solid #ffc107;
        }
        
        .status-icon {
            font-size: 1.2rem;
        }
        
        .status-message.success .status-icon {
            color: #28a745;
        }
        
        .status-message.error .status-icon {
            color: #dc3545;
        }
        
        .status-message.warning .status-icon {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header id="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" class="logo-link">
                        <img src="images/logo.png" alt="天津佰莱科技有限公司 Logo" class="logo-img" id="logo-img">
                        <div class="logo-text">
                            <h1>佰莱物联</h1>
                            <span class="logo-subtitle">天津佰莱科技有限公司</span>
                        </div>
                    </a>
                </div>
                
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                
                <nav class="main-nav">
                    <ul class="nav-list" id="mainMenu">
                        <li><a href="index.html" class="nav-link">返回网站</a></li>
                        <li><a href="#company-info" class="nav-link active">公司信息</a></li>
                        <li><a href="#product-manage" class="nav-link">产品管理</a></li>
                        <li><a href="#json-edit" class="nav-link">JSON编辑</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 管理页面内容 -->
    <div class="admin-container">
        <div class="admin-header">
            <div class="container">
                <h1>系统配置管理</h1>
                <p>在这里管理公司信息、产品数据和系统配置。所有更改将直接影响网站显示内容。</p>
            </div>
        </div>
        
        <div class="admin-content">
            <!-- 管理导航 -->
            <div class="admin-nav">
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="company-info">
                        <i class="fas fa-building"></i> 公司信息
                    </button>
                    <button class="admin-tab" data-tab="product-manage">
                        <i class="fas fa-boxes"></i> 产品管理
                    </button>
                    <button class="admin-tab" data-tab="json-edit">
                        <i class="fas fa-code"></i> JSON编辑器
                    </button>
                </div>
                
                <div class="system-info">
					<p><i class="fas fa-info-circle"></i> 配置文件位置: <code>config/config.json</code></p>
					<p><i class="fas fa-database"></i> 上次保存时间: <span id="lastSavedTime">从未保存</span></p>
					<p><i class="fas fa-cog"></i> 配置状态: <span id="configStatus">正在加载...</span></p>
                </div>
            </div>
            
            <!-- 公司信息面板 -->
            <div id="company-info" class="admin-panel active">
                <div class="panel-header">
                    <h2>公司信息设置</h2>
                    <div class="panel-actions">
                        <button class="btn btn-outline" id="resetCompanyForm">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                        <button class="btn btn-primary" id="saveCompanyInfo">
                            <i class="fas fa-save"></i> 保存公司信息
                        </button>
                    </div>
                </div>
                
                <form id="companyForm" class="company-form">
                    <div class="form-section">
                        <h3>基本信息</h3>
                        <div class="form-group">
                            <label for="companyName">公司名称 *</label>
                            <input type="text" id="companyName" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="companyBrand">商标/品牌 *</label>
                            <input type="text" id="companyBrand" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3>联系信息</h3>
                        <div class="form-group">
                            <label for="companyAddress">公司地址 *</label>
                            <input type="text" id="companyAddress" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="companyPhone">联系电话 *</label>
                            <input type="tel" id="companyPhone" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="companyServicePhone">服务热线</label>
                            <input type="tel" id="companyServicePhone" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label for="companyEmail">电子邮箱 *</label>
                            <input type="email" id="companyEmail" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="companyWorkHours">工作时间 *</label>
                            <input type="text" id="companyWorkHours" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3>版权信息</h3>
                        <div class="form-group">
                            <label for="companyCopyright">版权声明 *</label>
                            <input type="text" id="companyCopyright" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="companyBeian">备案号 *</label>
                            <input type="text" id="companyBeian" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            
            <!-- 产品管理面板 -->
            <div id="product-manage" class="admin-panel">
                <div class="panel-header">
                    <h2>产品管理</h2>
                    <div class="panel-actions">
                        <button class="btn btn-outline" id="refreshProducts">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                        <button class="btn btn-primary" id="addProduct">
                            <i class="fas fa-plus"></i> 添加产品
                        </button>
                    </div>
                </div>
                
                <div class="products-table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>产品图片</th>
                                <th>产品名称</th>
                                <th>分类</th>
                                <th>价格</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- 产品行将通过JavaScript动态生成 -->
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 50px;">
                                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                                    <p>正在加载产品数据...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- JSON编辑器面板 -->
            <div id="json-edit" class="admin-panel">
                <div class="panel-header">
                    <h2>JSON配置文件编辑器</h2>
                    <div class="panel-actions">
                        <button class="btn btn-outline" id="loadJson">
                            <i class="fas fa-download"></i> 重新加载
                        </button>
                        <button class="btn btn-primary" id="saveJson">
                            <i class="fas fa-save"></i> 保存JSON
                        </button>
                    </div>
                </div>
                
                <div class="json-editor-container">
                    <textarea id="jsonEditor" class="json-editor" spellcheck="false">
                        {
  "company": {
    "name": "天津佰莱科技有限公司",
    "brand": "bliot佰莱物联",
    "address": "天津市滨海新区经济技术开发区科技园15号楼3层",
    "phone": "022-12345678",
    "servicePhone": "400-888-9999",
    "email": "info@bliot-tech.com",
    "workHours": "周一至周五 9:00-18:00",
    "copyright": "© 2023 天津佰莱科技有限公司 版权所有",
    "beian": "津ICP备12345678号-1"
  },
  "products": {
    "categories": [
      {"id": "all", "name": "全部产品"},
      {"id": "industrial", "name": "工业物联网"},
      {"id": "elevator", "name": "电梯物联网"},
      {"id": "sensor", "name": "传感器"},
      {"id": "software", "name": "软件平台"}
    ],
    "items": []
  }
}
                    </textarea>
                </div>
                
                <div class="json-tools" style="margin-top: 20px;">
                    <button class="btn btn-outline" id="formatJson">
                        <i class="fas fa-align-left"></i> 格式化JSON
                    </button>
                    <button class="btn btn-outline" id="validateJson">
                        <i class="fas fa-check-circle"></i> 验证JSON
                    </button>
                    <button class="btn btn-outline" id="backupJson">
                        <i class="fas fa-file-export"></i> 备份配置
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 产品编辑模态框 -->
    <div id="productModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">编辑产品</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <form id="productForm">
                    <div class="form-section">
                        <h3>基本信息</h3>
                        <div class="form-group">
                            <label for="productId">产品ID</label>
                            <input type="number" id="productId" class="form-control" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="productName">产品名称 *</label>
                            <input type="text" id="productName" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="productCategory">产品分类 *</label>
                            <select id="productCategory" class="form-control" required>
                                <option value="">请选择分类</option>
                                <option value="industrial">工业物联网</option>
                                <option value="elevator">电梯物联网</option>
                                <option value="sensor">传感器</option>
                                <option value="software">软件平台</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="productPrice">价格 *</label>
                            <input type="text" id="productPrice" class="form-control" placeholder="例如: ¥ 3,850.00" required>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3>产品描述</h3>
                        <div class="form-group">
                            <label for="productDescription">产品描述 *</label>
                            <textarea id="productDescription" class="form-control textarea" rows="4" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="productFeatures">产品特性（每行一个特性）</label>
                            <textarea id="productFeatures" class="form-control textarea" rows="4" placeholder="每行输入一个产品特性"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3>产品图片</h3>
                        <div class="form-group">
                            <label for="productImage">图片URL *</label>
                            <input type="url" id="productImage" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>图片预览</label>
                            <div id="imagePreview" style="width: 200px; height: 150px; border: 1px solid #eaeaea; border-radius: 6px; overflow: hidden; margin-top: 10px;">
                                <img id="previewImage" src="" alt="图片预览" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                                <div id="noPreview" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999;">
                                    <i class="fas fa-image fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3>产品规格（可选）</h3>
                        <div id="specsContainer">
                            <div class="spec-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <input type="text" class="form-control spec-key" placeholder="规格名称" style="flex: 1;">
                                <input type="text" class="form-control spec-value" placeholder="规格值" style="flex: 2;">
                                <button type="button" class="btn btn-outline remove-spec" style="padding: 8px 15px;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-outline" id="addSpec">
                            <i class="fas fa-plus"></i> 添加规格
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelProduct">取消</button>
                <button type="button" class="btn btn-primary" id="saveProduct">保存产品</button>
            </div>
        </div>
    </div>
    
    <!-- 状态消息 -->
    <div id="statusMessage" class="status-message">
        <i class="fas fa-check-circle status-icon"></i>
        <div>
            <strong id="statusTitle">操作成功</strong>
            <p id="statusText">操作已完成</p>
        </div>
    </div>
    
    <!-- 脚本文件 -->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
