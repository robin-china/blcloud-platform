<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户中心</title>
<!-- 资源用相对路径，这样根路径部署和 /platform/ 子路径部署都能正确加载 -->
<link rel="stylesheet" href="../assets/ui.css" />
<style>
/* 首屏防闪：这套页面是 in-DOM 模板，{{ }} 就写在 HTML 里，
   Vue 挂载前浏览器会把它们当普通文本渲染出来 —— 也就是用户看到的「一堆花括号」。
   挂载完成前先把 #app 藏起来，只显示一个加载态。
   必须内联：外链 CSS 还得等下载，等到了花括号早就闪过了。 */
#app { display: none; }
#app.ready { display: block; }
#boot { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
  gap: 10px; background: #f6f7fb; color: #8a93a6;
  font: 14px/1.5 "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif; }
#boot .spin { width: 16px; height: 16px; border: 2px solid #e6e9f0; border-top-color: #2563eb;
  border-radius: 50%; animation: boot-spin .8s linear infinite; }
#boot.fail { color: #dc2626; cursor: pointer; }
@keyframes boot-spin { to { transform: rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  #boot { background: #14161b; color: #9aa3b5; }
  #boot .spin { border-color: #2a2f3a; border-top-color: #60a5fa; }
}
</style>
</head>
<body>
<div id="boot"><span class="spin"></span><span>加载中…</span></div>
<div id="app">
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <img v-if="state.settings.site_logo" :src="state.settings.site_logo" alt="logo" />
        <span>{{ state.settings.site_name || '用户中心' }}</span>
      </div>
      <nav class="site-nav">
        <a href="#/shop" :class="state.route==='shop'?'active':''">官方产品</a>
        <a href="#/space" :class="state.route==='space'?'active':''">我的空间</a>
        <a href="#/licenses" :class="state.route==='licenses'?'active':''">我的授权</a>
        <a href="#/devices" :class="state.route==='devices'?'active':''">我的硬件</a>
        <a href="#/orders" :class="state.route==='orders'?'active':''">我的订单</a>
        <!-- 我的收益只对代理商身份开放；直接输入地址也能访问页面，页面内会提示如何成为代理商 -->
        <a v-if="state.user && state.user.agent_status==='active'" href="#/earnings" :class="state.route==='earnings'?'active':''">我的收益</a>
        <a href="#/blcloud" :class="state.route==='blcloud'?'active':''">blcloud</a>
        <a href="#/account" :class="state.route==='account'?'active':''">账户中心</a>
      </nav>
      <div class="spacer"></div>
      <div v-if="state.user" class="user-chip">
        <img v-if="userAvatar" :src="userAvatar" alt="" class="avatar" style="object-fit:cover" />
        <div v-else class="avatar">{{ (state.user.nickname || 'U').slice(0, 1) }}</div>
        <span>{{ state.user.nickname }}</span>
        <button class="btn sm" @click="logout">退出</button>
      </div>
      <a v-else class="btn primary sm" href="#/login">登录</a>
    </div>
  </header>

  <main class="site-main">
    <page-shop v-if="state.route === 'shop'"></page-shop>
    <page-product v-if="state.route === 'product'" :key="state.param"></page-product>
    <page-space v-if="state.route === 'space'"></page-space>
    <page-my-licenses v-if="state.route === 'licenses'"></page-my-licenses>
    <page-my-devices v-if="state.route === 'devices'"></page-my-devices>
    <page-my-orders v-if="state.route === 'orders'"></page-my-orders>
    <page-earnings v-if="state.route === 'earnings'"></page-earnings>
    <page-user-blcloud v-if="state.route === 'blcloud'"></page-user-blcloud>
    <page-account v-if="state.route === 'account'"></page-account>
    <page-user-login v-if="state.route === 'login'" @logged="onLogged"></page-user-login>
  </main>

  <footer class="site-foot">
    <div>{{ state.settings.site_copyright }}</div>
    <div style="margin-top:4px">{{ state.settings.site_icp }} {{ state.settings.site_contact }}</div>
  </footer>
</div>

<script src="../vendor/vue.global.prod.js"></script>
<!-- 内置卡通头像：必须早于 api.js（U.avatar 会读它）与页面脚本 -->
<script src="../assets/avatars.js"></script>
<script src="../assets/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
<script src="js/pages-earnings.js"></script>
<script src="js/pages-blcloud.js"></script>
<script>
  const PAGES = ['Shop', 'Product', 'Space', 'MyLicenses', 'MyDevices', 'MyOrders', 'Earnings', 'UserBlcloud', 'Account', 'UserLogin'];
  const kebab = (s) => s.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
  for (const name of PAGES) {
    const comp = window['Page' + name];
    if (comp) UserApp.app.component('page-' + kebab(name), comp);
  }
  // 挂载成功才撤遮罩：这时模板里的 {{ }} 已经全部编译掉了，不会闪
  try {
    UserApp.app.mount('#app');
    document.getElementById('app').classList.add('ready');
    const boot = document.getElementById('boot');
    if (boot) boot.remove();
  } catch (err) {
    console.error(err);
    const boot = document.getElementById('boot');
    if (boot) { boot.className = 'fail'; boot.textContent = '页面加载失败，点击刷新重试'; boot.onclick = () => location.reload(); }
  }
  // 兜底：某个脚本报错导致走不到挂载，也不能永远停在「加载中」
  setTimeout(() => {
    const el = document.getElementById('app');
    if (!el || el.classList.contains('ready')) return;
    const boot = document.getElementById('boot');
    if (boot) { boot.className = 'fail'; boot.textContent = '加载超时，点击刷新重试'; boot.onclick = () => location.reload(); }
  }, 10000);
</script>
</body>
</html>
