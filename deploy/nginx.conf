# Nginx 反向代理 + HTTPS
# 复制：sudo cp deploy/nginx.conf /etc/nginx/conf.d/blcloud.conf
# 证书：sudo certbot --nginx -d 你的域名
# 生效：sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    server_name  your-domain.com;
    # 微信/支付宝回调前先做 let's encrypt 校验，保留这段
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name  your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传与包体上限（安装包可能较大）
    client_max_body_size 200m;

    # 安全响应头
    add_header X-Content-Type-Options    nosniff       always;
    add_header X-Frame-Options           SAMEORIGIN    always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/blcloud.access.log;
    error_log  /var/log/nginx/blcloud.error.log;

    # 本地上传文件：直接由 nginx 吐，不经过 Node
    location /uploads/ {
        alias /opt/blcloud/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 只允许图片/常见类型，挡住 .html/.svg 造成的存储型 XSS
        location ~* \.(html|htm|svg|php|jsp|asp)$ { return 403; }
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
