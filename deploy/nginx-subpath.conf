# Nginx 子路径部署：把系统挂在 www.bliot.cn/platform/ 下，与现有官网共存
# 特点：不需要新域名、不需要新证书、不碰官网现有配置
#
# 用法：
#   1) 把下面两段加进官网现有的 server 配置里（推荐，共用同一份证书）
#      或单独存成 /etc/nginx/conf.d/blcloud.conf
#   2) 后端必须带环境变量：BASE_PATH=platform
#   3) nginx -t && systemctl reload nginx

# ---- 方案 A：加进官网现有 server 块（推荐）----
# server {
#     listen 443 ssl http2;
#     server_name www.bliot.cn;
#     ... 官网原有配置（root / try_files 等）保持不变 ...
#
#     # ↓↓↓ 只追加这一段 ↓↓↓
#     # 注意 ^~ ：官网若含 "location ~* \.(css|js|...)$" 这类正则规则，会抢走静态资源，
#     # 加了 ^~ 表示匹配到即停，不再走正则
#     location ^~ /platform/ {
#         # 防混合内容：http:// 子资源自动升级为 https，避免 Chrome「此页面不安全」警告
#         add_header Content-Security-Policy "upgrade-insecure-requests" always;
#         proxy_pass         http://127.0.0.1:3000;   # 末尾不带 /，让后端看到完整 /platform/xxx
#         proxy_http_version 1.1;
#         proxy_set_header   Host              $host;
#         proxy_set_header   X-Real-IP         $remote_addr;
#         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header   X-Forwarded-Proto $scheme;
#         proxy_read_timeout 120s;
#         proxy_send_timeout 120s;
#         client_max_body_size 200m;
#     }
# }

# ---- 方案 B：独立 server 块（官网配置不想动时用）----
server {
    listen 443 ssl http2;
    server_name www.bliot.cn;

    # 复用官网已有的证书路径，按实际情况改
    ssl_certificate     /etc/nginx/ssl/bliot.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/bliot.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options    nosniff    always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/blcloud.access.log;
    error_log  /var/log/nginx/blcloud.error.log;

    # 管理后台入口跳转（可选，方便记忆）
    # = 精确匹配优先级最高，不受下面 ^~ 影响
    location = /platform {
        return 301 /platform/admin/;
    }

    # 上传文件由 nginx 直出，不经过 Node
    location ^~ /platform/uploads/ {
        alias /opt/blcloud/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 挡住 .html/.svg 造成的存储型 XSS
        location ~* \.(html|htm|svg|php|jsp|asp)$ { return 403; }
    }

    # 其余全部反代到 Node（后端已配置 BASE_PATH=platform）
    location ^~ /platform/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200m;   # 安装包可能较大
    }

    # 官网原有内容按你自己的配置放这里
    location / {
        root /var/www/bliot;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name www.bliot.cn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---- 关键点（三条都是实测踩过的坑）----
# 1. proxy_pass 末尾**不要**加 / ：写成 http://127.0.0.1:3000 会原样透传 /platform/api/xxx，
#    而后端 BASE_PATH=platform 正是等着这个前缀。
#    如果写成 http://127.0.0.1:3000/ （带斜杠），nginx 会剥掉 /platform，后端就 404 了。
# 2. location 必须写成 ^~ /platform/ ：官网常见 location ~* \.(css|js|png|woff2?)$ 这类
#    静态资源规则是「正则 location」，优先级高于普通前缀 location。不加 ^~ 的话，
#    页面 HTML（/platform/admin/）能正常代理，但 .css / .js 会被主站规则截胡变成 404。
# 3. 后端环境变量必须设：BASE_PATH=platform（见 deploy/ecosystem.config.cjs）。
#    注意 pm2 restart --update-env **不会**读入生态系统文件中新增的 env，
#    必须 pm2 delete <app> && pm2 start deploy/ecosystem.config.cjs 才生效。
# 4. 微信后台要填的地址：
#      服务器地址(URL)   https://www.bliot.cn/platform/api/wechat/server
#      网页授权域名      www.bliot.cn          （只填域名，不带路径）
#      支付回调域名      www.bliot.cn          （路径 /platform/api/pay/notify/wxpay 由系统自动拼）
